name: frontend
description: "AI-powered video search application."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_bloc: 8.1.6
  dio: 5.7.0
  equatable: 2.0.7
  go_router: 14.6.3
  youtube_player_flutter: 9.1.1
  youtube_player_iframe: 5.1.2
  video_player: 2.9.1
  chewie: 1.8.5
  file_picker: 8.1.7
  image_picker: 1.1.2
  flutter_svg: 2.0.12
  cached_network_image: 3.4.1
  shimmer: 3.0.0
  lottie: 3.1.2
  google_fonts: 6.2.1
  intl: 0.19.0
  url_launcher: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/

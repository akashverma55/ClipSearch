name: frontend
description: "AI-powered video search application."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.9.1
  equatable: ^2.0.8
  go_router: ^17.0.1
  youtube_player_flutter: ^9.1.3
  video_player: ^2.10.1
  chewie: ^1.13.0
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.2
  google_fonts: ^8.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
